<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Combining CSS Selectors</title>
  <style>

    h1, h2 {
      color: blueviolet;
    }

    .box .done {
      color: firebrick;
    }

    .box .list li {
      color: blue;
    }

    .box .list li.done {
      color: green;
    }

    ul .done {
      font-size: 1rem;
    }
  </style>
</head>

<body>
  <h1>To Do List</h1>
  <h2>Monday</h2>
  <div class="box">
    <p class="done">Do these things today!</p>
    <ul class="list">
      <li>Wash Clothes</li>
      <li class="done">Read</li>
      <li class="done">Maths Questions</li>
    </ul>
  </div>

  <ul>
    <h6>Other items</h6>
  </ul>
  <p>The best preparation for tomorrow is doing your best today.</p>

</body>

</html>
