<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Display Property</title>
  <style>
    body { font-family: serif; }
    .box {
      display: inline-block;
      width: 200px;
      height: 200px;
      color: white;
      padding: 5px;
      box-sizing: border-box;
      vertical-align: top;
    }
    .red { background-color: red; }
    .green { background-color: green; }
    .blue { background-color: blue; }
  </style>
</head>
<body>
  <h1>CSS Display Property</h1>
  <div class="box red">Red Paragraph</div>
  <div class="box green">Green Paragraph</div>
  <div class="box blue">Blue Paragraph</div>
</body>
</html>
