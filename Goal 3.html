<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      background-color: #fdf5e6;
      font-family: serif;
      margin: 0;
      padding: 20px 0;
    }
    .box {
      color: white;
      font-size: 2.5rem;
      font-weight: bold;
      padding: 10px 20px;
      margin-bottom: 20px;
    }
    .hello {
      background-color: #8fbc8f;
    }
    .world {
      background-color: #cd853f;
    }
  </style>
</head>
<body>
  <div class="box hello">Hello</div>
  <div class="box world">World</div>
</body>
</html>
