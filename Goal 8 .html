<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    .container {
      position: relative;
      top: 200px;
      left: 200px;
      width: 500px;
      height: 300px;
      background-color: blue;
    }
    .circle {
      position: absolute;
      top: 150px;
      left: 250px;
      width: 200px;
      height: 200px;
      background-color: red;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="circle"></div>
  </div>
</body>
</html>
