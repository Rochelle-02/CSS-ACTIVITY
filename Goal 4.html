<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Important CSS Properties</title>

    <style>
        body {
            margin: 0;
            background-color: #6495e3;
            color: white;
            font-family: Georgia, "Times New Roman", serif;
            height: 100vh;
        }

        .title {
            font-size: 80px;
            font-weight: bold;
            margin: 45px 10px;
        }

        .color {
            color: #ff7f32;
            font-size: 40px;
            margin: 55px 10px;
        }

        .font-size {
            font-size: 90px;
            font-weight: normal;
            margin: 160px 10px;
        }

        .font-weight {
            font-size: 40px;
            font-weight: bold;
            margin: 0 10px 45px;
        }

        /* FIXED FONT FAMILY */
        .font-family {
            font-size: 35px;
            font-family: "Brush Script MT", "Segoe Script", cursive;
            font-style: italic;
            margin-left: 10px;
        }

        .text-align {
            font-size: 40px;
            font-weight: normal;
            text-align: right;
            margin-right: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <h1 class="title">Important CSS Properties</h1>

    <div class="color">Color</div>

    <div class="font-size">Font Size</div>

    <div class="font-weight">Font Weight</div>

    <div class="font-family">Font Family</div>

    <div class="text-align">Text Align</div>

</body>
</html>
